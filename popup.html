<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spectrometer EQ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <header>
    <span class="title">Spectrometer EQ</span>
    <div class="controls">
      <select id="mode-select">
        <option value="bars">Bars</option>
        <option value="wave">Waveform</option>
        <option value="mirror">Mirror</option>
      </select>
      <button id="btn-capture">Start</button>
    </div>
  </header>

  <!-- ── Spectrum Canvas ───────────────────────────────────────────────── -->
  <div class="canvas-wrap">
    <canvas id="canvas" width="480" height="200"></canvas>
    <div id="status">Click <strong>Start</strong> to begin capturing tab audio</div>
  </div>

  <!-- ── Info Bar ──────────────────────────────────────────────────────── -->
  <div class="info-bar">
    <span id="peak-label">Peak: —</span>
    <span id="freq-label">FFT: 2048</span>
  </div>

  <!-- ── VU Meter ──────────────────────────────────────────────────────── -->
  <div class="vu-wrap">
    <canvas id="vu-canvas" width="480" height="140"></canvas>
  </div>

  <!-- ── 3-Band Rotary EQ ──────────────────────────────────────────────── -->
  <section class="eq-section">
    <div class="eq-title">3-BAND ROTARY EQ</div>
    <div class="eq-row">

      <!-- HIGH band -->
      <div class="knob-wrap" data-band="high">
        <div class="band-name high">HIGH</div>
        <div class="knob-container">
          <svg class="arc-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
            <path d="M 23.00 69.44 A 34 34 0 1 1 57.00 69.44"
                  fill="none" stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="40" y1="5" x2="40" y2="13"
                  stroke="#404040" stroke-width="2" stroke-linecap="round"/>
            <path id="arc-fill-high" d=""
                  fill="none" stroke="#c05030" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <div class="knob-body" id="knob-body-high">
            <div class="knob-pip high-pip"></div>
          </div>
        </div>
        <div class="db-value" id="db-high">0.0 dB</div>
        <div class="freq-label">3.2 kHz</div>
      </div>

      <!-- MID band -->
      <div class="knob-wrap" data-band="mid">
        <div class="band-name mid">MID</div>
        <div class="knob-container">
          <svg class="arc-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
            <path d="M 23.00 69.44 A 34 34 0 1 1 57.00 69.44"
                  fill="none" stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="40" y1="5" x2="40" y2="13"
                  stroke="#404040" stroke-width="2" stroke-linecap="round"/>
            <path id="arc-fill-mid" d=""
                  fill="none" stroke="#b89020" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <div class="knob-body" id="knob-body-mid">
            <div class="knob-pip mid-pip"></div>
          </div>
        </div>
        <div class="db-value" id="db-mid">0.0 dB</div>
        <div class="freq-label">1.0 kHz</div>
      </div>

      <!-- LOW band -->
      <div class="knob-wrap" data-band="low">
        <div class="band-name low">LOW</div>
        <div class="knob-container">
          <svg class="arc-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
            <path d="M 23.00 69.44 A 34 34 0 1 1 57.00 69.44"
                  fill="none" stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="40" y1="5" x2="40" y2="13"
                  stroke="#404040" stroke-width="2" stroke-linecap="round"/>
            <path id="arc-fill-low" d=""
                  fill="none" stroke="#4880c0" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <div class="knob-body" id="knob-body-low">
            <div class="knob-pip low-pip"></div>
          </div>
        </div>
        <div class="db-value" id="db-low">0.0 dB</div>
        <div class="freq-label">320 Hz</div>
      </div>

    </div><!-- .eq-row -->
    <span class="hint">↕ drag knobs &nbsp;·&nbsp; scroll to trim &nbsp;·&nbsp; double-click to reset</span>
  </section>

  <script src="popup.js"></script>
</body>
</html>
