<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spectrometer EQ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────────────────── -->
  <header>
    <div class="seg-control" id="mode-seg">
      <button class="seg-btn active" data-value="bars">Bars</button>
      <button class="seg-btn" data-value="wave">Wave</button>
    </div>
    <button id="btn-capture">Start</button>
  </header>

  <!-- ── Spectrum Canvas ───────────────────────────────────────────────────── -->
  <div class="canvas-wrap">
    <canvas id="canvas" width="480" height="200"></canvas>
    <div id="status">Click <strong>Start</strong> to begin capturing tab audio</div>
  </div>

  <!-- ── Info Bar ──────────────────────────────────────────────────────────── -->
  <div class="info-bar">
    <span class="app-label">SPECTROMETER EQ</span>
    <span id="peak-label">Peak: —</span>
  </div>

  <!-- ── 3-Band Vertical Slider EQ ─────────────────────────────────────────── -->
  <section class="eq-section">
    <div class="eq-row">

      <!-- HIGH -->
      <div class="band-wrap" data-band="high">
        <div class="db-value" id="db-high">+0.0</div>
        <div class="slider-track" id="track-high">
          <div class="slider-thumb" id="thumb-high"></div>
          <div class="slider-pip high-pip"></div>
        </div>
        <div class="band-label high">High</div>
        <div class="freq-label">3.2 kHz</div>
      </div>

      <!-- MID -->
      <div class="band-wrap" data-band="mid">
        <div class="db-value" id="db-mid">+0.0</div>
        <div class="slider-track" id="track-mid">
          <div class="slider-thumb" id="thumb-mid"></div>
          <div class="slider-pip mid-pip"></div>
        </div>
        <div class="band-label mid">Mid</div>
        <div class="freq-label">1.0 kHz</div>
      </div>

      <!-- LOW -->
      <div class="band-wrap" data-band="low">
        <div class="db-value" id="db-low">+0.0</div>
        <div class="slider-track" id="track-low">
          <div class="slider-thumb" id="thumb-low"></div>
          <div class="slider-pip low-pip"></div>
        </div>
        <div class="band-label low">Low</div>
        <div class="freq-label">320 Hz</div>
      </div>

    </div>
    <span class="hint">↕ drag · scroll · double-click to reset</span>
  </section>

  <script src="popup.js"></script>
</body>
</html>
